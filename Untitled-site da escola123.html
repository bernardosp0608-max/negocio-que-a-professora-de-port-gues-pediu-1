<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como você se sente?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #29473a;
      background: #f3f5eb;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    main {
      width: min(100%, 580px);
      padding: 48px 36px;
      text-align: center;
      background: #fffdf8;
      border: 1px solid #e4e8da;
      border-radius: 32px;
      box-shadow: 0 18px 50px #385b3d12;
    }
    .leaf { font-size: 30px; }
    h1 { margin: 16px 0 10px; font-size: clamp(28px, 6vw, 38px); }
    .intro { margin: 0; color: #708078; font-size: 17px; line-height: 1.6; }
    .scale {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 8px;
      margin: 30px 0 14px;
    }
    .scale button {
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid #dce4d7;
      border-radius: 14px;
      color: #355746;
      background: #f5f7ef;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, background .15s, color .15s;
    }
    .scale button:hover { transform: translateY(-3px); }
    .scale button:focus-visible { outline: 3px solid #90b39a; outline-offset: 3px; }
    .scale button[aria-pressed="true"] { color: #fff; background: #58866a; border-color: #58866a; }
    .labels { display: flex; justify-content: space-between; gap: 8px; color: #7c877b; font-size: 13px; }
    #feedback { min-height: 26px; margin: 24px 0 0; color: #477258; font-weight: 700; }
    @media (max-width: 420px) {
      main { padding: 36px 18px; }
      .scale { gap: 4px; }
      .scale button { border-radius: 9px; font-size: 14px; }
      .labels { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="leaf" aria-hidden="true">🌿</div>
    <h1>Como você se sente?</h1>
    <p class="intro">Faça uma pausa e escolha o número que melhor representa seu momento.</p>
    <div class="scale" role="group" aria-label="Avalie como você se sente de 0 a 10">
      <button type="button" aria-pressed="false" aria-label="0">0</button>
      <button type="button" aria-pressed="false" aria-label="1">1</button>
      <button type="button" aria-pressed="false" aria-label="2">2</button>
      <button type="button" aria-pressed="false" aria-label="3">3</button>
      <button type="button" aria-pressed="false" aria-label="4">4</button>
      <button type="button" aria-pressed="false" aria-label="5">5</button>
      <button type="button" aria-pressed="false" aria-label="6">6</button>
      <button type="button" aria-pressed="false" aria-label="7">7</button>
      <button type="button" aria-pressed="false" aria-label="8">8</button>
      <button type="button" aria-pressed="false" aria-label="9">9</button>
      <button type="button" aria-pressed="false" aria-label="10">10</button>
    </div>
    <div class="labels"><span>0–4 · Ruim</span><span>5–7 · Neutro</span><span>8–10 · Ótimo</span></div>
    <p id="feedback" aria-live="polite"></p>
  </main>
  <script>
    const buttons = document.querySelectorAll('.scale button');
    const feedback = document.querySelector('#feedback');
    buttons.forEach((button, index) => {
      button.addEventListener('click', () => {
        buttons.forEach(item => item.setAttribute('aria-pressed', 'false'));
        button.setAttribute('aria-pressed', 'true');
        feedback.textContent = index <= 4
          ? 'Obrigado por compartilhar. Cuide-se com carinho.'
          : index <= 7
            ? 'Obrigado por compartilhar como você está.'
            : 'Que bom! Continue aproveitando esse momento.';
      });
    });
  </script>
</body>
</html>
